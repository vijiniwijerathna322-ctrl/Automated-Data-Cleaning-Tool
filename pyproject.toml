[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "automated-data-cleaning-tool"
version = "0.1.0"
description = "Config-driven data cleaning and ML-preparation pipeline with a REST API, Streamlit UI and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Cleaning Tool contributors" }]
keywords = ["data-cleaning", "pandas", "fastapi", "streamlit", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
]
ui = [
    "streamlit>=1.50",
    "plotly>=5.20",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs",
    "types-PyYAML",
]
all = ["automated-data-cleaning-tool[api,ui,dev]"]

[project.scripts]
datacleaner = "datacleaner.cli:app"
datacleaner-ui = "datacleaner.ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datacleaner"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # pep8-naming
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.flake8-bugbear]
# Path("...") as a Typer/Click option default is a constant, not shared mutable state.
extend-immutable-calls = ["pathlib.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["datacleaner.core.*", "datacleaner.io.*"]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "plotly.*", "streamlit.*", "pyarrow.*"]
ignore_missing_imports = true

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=datacleaner --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error::DeprecationWarning:datacleaner.*"]

[tool.coverage.run]
branch = true
source = ["datacleaner"]
# The Streamlit script is exercised by an AppTest smoke test but is UI glue,
# not logic; keep it out of the coverage gate.
omit = ["*/datacleaner/ui/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
